[General]
# Kitsune — Ase, the seven-tailed kitsune, at the door.
# Her greeter reads exactly one key: the username rule she was
# built under (the valence theme runs the same). With it false,
# the name is lowered before it is spoken to PAM, matching
# kitsune.conf on the machine she first stood on.
AllowUppercaseLettersInUsernames=false
