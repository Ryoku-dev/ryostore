[General]
# Backdrop blur radius, 0-64. Also drives how far the wallpaper is
# downsampled before it is stretched back over the screen.
blurStrength=64
# Alpha of the frosted card's fill, 0-1. The border and the inner
# highlight scale with it.
cardOpacity=0.14
# Seconds in the clock. Costs a repaint per second.
showSeconds=false
# false gives a 12-hour clock with an am/pm suffix.
clock24h=true
# How far the wallpaper is darkened behind the glass, 0-1.
dimAmount=0.58
