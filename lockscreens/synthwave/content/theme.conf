[General]
# Grid scroll rate; 1.0 is one perspective row per ~5.2s.
gridSpeed=1.0
# CRT scanline darkness, 0 disables them.
scanlineOpacity=0.10
# Chromatic aberration of the clock, in 768p-baseline pixels.
aberration=3.0
clock24h=true
# Hue of the hot neon, in degrees. The cyan and the sun's amber derive from it.
neonHue=315
