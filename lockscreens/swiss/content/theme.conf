[General]
# Swiss. Every value is read back as a string.

# 24-hour clock. false gives a 12-hour clock with a small meridiem beside the seconds.
clock24h=true

# the small ticking numeral on the clock's baseline, at the right margin
showSeconds=true

# the module, in design pixels at a 768px-tall screen, scaled with the screen.
# every margin and every gap on this page is this number or a multiple of it.
marginUnit=44

# thickness of the rule, in PHYSICAL device pixels
hairline=1

# the caret. a colors.json key (primary, secondary, tertiary, error) or a literal #rrggbb
accent=primary
