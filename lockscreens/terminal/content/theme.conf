[General]
# hidden   = keystrokes are not echoed at all, like sudo
# asterisk = one asterisk per keystroke
echoMode=hidden
# milliseconds per character of the boot log typewriter (jittered per char)
typeSpeed=18
showScanlines=true
# true  = ink is tinted from ~/.cache/ryoku/colors.json
# false = classic single-phosphor green console
accentFromPalette=true
