[General]
# Fūin — Jurai's Threshold as an SDDM greeter theme.
# Every key is optional; the defaults below are the shipped face.

# The picture behind the veil: an absolute path to an image file.
# Empty (the default) is the sealed door — Jurai's dark ground alone,
# veiled. Whatever picture is named is blurred past reading, as the
# shell's lock treats every wallpaper.
background=

# How the picture is fitted: fill (cover, cropping the overflow) or
# fit (contain, letterboxing).
wallpaperMode=fill

# The density step the face is measured at: compact, normal, comfortable.
density=normal

# The bell's face: true for 24-hour, false for the twelve-hour dial.
twentyFourHour=true

# The strength of the glass on the portrait badge and the password
# field: 0 to 1.
opacity=0.72

# How round the surfaces are, as a percentage of the design: 100 is the
# shape as drawn, 0 a rectangle. Round-by-nature drawings — the portrait,
# the dial — never take it.
radiusPercent=100

# The two voices. The theme bundles Spectral and Orbitron (SIL Open
# Font License, content/fonts/OFL.txt), so these names resolve out of
# the box; name other installed faces here if you prefer them.
fontExpressive=Spectral
fontTechnical=Orbitron
