name: catalogue

# Trusted integrity gate. Runs ONLY on push to main — i.e. AFTER review and
# merge, when the tree is already trusted — so it may safely execute the repo's
# own validators and shellcheck the installers.
#
# Pull requests are screened by pr-security-screen.yml, which never executes
# PR-authored code. DO NOT add a `pull_request` trigger here: that is precisely
# the unsafe pattern (running contributor code on the runner) this split removed.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: catalogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned, checksum-verified shellcheck (fail closed)
        run: |
          bindir="$GITHUB_WORKSPACE/.sectools/bin"
          bash .github/scripts/install-shellcheck.sh "$bindir"
          echo "$bindir" >> "$GITHUB_PATH"

      - name: ShellCheck the validator and installers
        run: |
          shellcheck tests/validate-catalogue.sh
          find installers bundles -type f \( -path 'installers/*.sh' -o -path '*/installers/*.sh' \) \
            -print0 | xargs -0 -r shellcheck

      - name: Validate catalogue integrity (shell)
        run: bash tests/validate-catalogue.sh

      - name: Validate product catalogue (python)
        run: python3 tests/validate-store.py
