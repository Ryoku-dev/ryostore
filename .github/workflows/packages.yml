name: packages

# validate-catalogue.sh proves the catalogue is internally consistent; it never
# asks whether a package name is still real. cemu sat in the gaming bundle
# flagged out-of-date, and `proton-cachyos` became unresolvable upstream after
# CachyOS split it into -slr and -native. Both would have shipped.
#
# This runs on a schedule (and manual dispatch) on the trusted default branch,
# not on PRs: a package disappearing is drift in someone else's repo, not a
# regression in a commit, so it must not fail a PR that never touched a manifest.
# Upstream being unreachable is reported and skipped, never a failure.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd

      - name: Every bundle package resolves to its declared source
        run: python3 tests/verify-packages.py
