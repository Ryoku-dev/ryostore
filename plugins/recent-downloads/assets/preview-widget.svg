<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Recent Downloads bar button preview</title>
  <desc id="desc">An illustrative crop of a dark desktop bar with the Recent Downloads down-arrow button.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#222831"/>
      <stop offset="1" stop-color="#111418"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#262b31" stop-opacity=".96"/>
      <stop offset="1" stop-color="#191d22" stop-opacity=".98"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="180" fill="#a9c9a2" opacity=".06"/>
  <circle cx="120" cy="350" r="230" fill="#a9c9a2" opacity=".04"/>
  <g filter="url(#shadow)">
    <rect x="48" y="88" width="1104" height="72" rx="24" fill="url(#bar)" stroke="#ffffff" stroke-opacity=".1"/>
    <g fill="#d7dbe0" opacity=".78" font-family="sans-serif" font-size="17">
      <circle cx="84" cy="124" r="5" fill="#a9c9a2"/>
      <text x="108" y="130">1</text><text x="143" y="130">2</text><text x="178" y="130">3</text>
      <text x="240" y="130" opacity=".55">•••</text>
      <text x="925" y="130" opacity=".68">◌</text>
      <text x="970" y="130" opacity=".68">⌁</text>
      <text x="1020" y="130" opacity=".68">88%</text>
      <text x="1084" y="130" opacity=".82">14:32</text>
    </g>
    <rect x="864" y="98" width="44" height="52" rx="16" fill="#a9c9a2" fill-opacity=".12"/>
    <g transform="translate(874 108)" fill="none" stroke="#c9dec4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 20h16"/>
      <path d="M14 3v14m0 0 4-4m-4 4-4-4"/>
    </g>
  </g>
  <text x="52" y="226" fill="#c9dec4" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="3">BAR BUTTON · ILLUSTRATIVE PREVIEW</text>
  <text x="52" y="270" fill="#f2f3f4" font-family="sans-serif" font-size="31" font-weight="600">One click away from your latest downloads.</text>
  <text x="52" y="308" fill="#b4bbc3" font-family="sans-serif" font-size="18">Move it to any QS Bar lane and reorder it in Bar Studio.</text>
</svg>
